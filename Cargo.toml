[package]
name = "tgrep"
version = "0.1.0"
edition = "2021"

[dependencies]
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-printer = "0.1"
regex-syntax = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
crossbeam-channel = "0.5"
libc = "0.2"

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
